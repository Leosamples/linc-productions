<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio — Linc Productions</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #050505;
    --panel: #0c0c0c;
    --line: rgba(245, 242, 234, 0.10);
    --line-strong: rgba(245, 242, 234, 0.22);
    --paper: #F5F2EA;
    --muted: #9C9890;
    --signal: #35B7FF;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); }
  body {
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--signal); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* Signature dot label, same as the site's .kicker */
  .kicker {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.8125rem; color: var(--muted); letter-spacing: 0.01em;
  }
  .kicker::before {
    content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--signal);
  }
  .wordmark {
    font-family: var(--display); font-weight: 500; letter-spacing: 0.06em; font-size: 0.95rem;
  }
  .wordmark em { font-style: normal; color: var(--muted); }

  .pill {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 0.55rem 1.1rem; font-size: 0.8125rem;
    background: rgba(5, 5, 5, 0.55); backdrop-filter: blur(10px);
    transition: border-color 0.3s, color 0.3s;
  }
  .pill:hover { border-color: var(--signal); color: var(--signal); }

  /* ── Stage: star field + sphere ── */
  #stage {
    position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(53, 183, 255, 0.10), transparent 60%),
      var(--ink);
  }
  #stage.dragging { cursor: grabbing; }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  #viewport {
    position: absolute; inset: 0; perspective: 1400px;
    display: grid; place-items: center;
    opacity: 0; transform: scale(0.92);
    transition: opacity 1.4s var(--ease), transform 1.6s var(--ease);
  }
  body.ready #viewport { opacity: 1; transform: none; }
  #sphere { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
  .card {
    position: absolute; left: 0; top: 0;
    transform-style: preserve-3d;
    border-radius: 3px; overflow: hidden;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    transition: border-color 0.3s, box-shadow 0.3s;
    will-change: transform, opacity;
  }
  .card img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    pointer-events: none; user-select: none;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--signal);
    box-shadow: 0 0 0 1px var(--signal), 0 0 40px rgba(53, 183, 255, 0.35);
  }

  /* ── Overlay chrome ── */
  .chrome {
    position: fixed; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 1s var(--ease) 0.4s;
  }
  body.ready .chrome { opacity: 1; }
  .chrome > * { pointer-events: auto; }
  #top {
    top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: calc(1.25rem + env(safe-area-inset-top, 0px)) clamp(1rem, 4vw, 3rem) 1rem;
  }
  #home { display: inline-flex; align-items: center; gap: 0.75rem; }
  #home img { height: 26px; width: auto; }
  #top-actions { display: flex; gap: 0.5rem; }

  #intro {
    left: clamp(1rem, 4vw, 3rem); bottom: calc(clamp(1.25rem, 4vw, 3rem) + env(safe-area-inset-bottom, 0px));
    max-width: min(34rem, calc(100vw - 2rem));
  }
  #headline {
    margin-top: 0.9rem;
    font-family: var(--serif); font-weight: 400; font-style: italic;
    font-size: clamp(2.2rem, 5.2vw, 4.4rem); line-height: 1.02; letter-spacing: -0.01em;
    text-wrap: balance;
  }
  #headline span {
    display: inline-block; opacity: 0; transform: translateY(0.4em);
    transition: opacity 0.9s var(--ease), transform 1.1s var(--ease);
    transition-delay: calc(0.6s + var(--i) * 90ms);
  }
  body.ready #headline span { opacity: 1; transform: none; }
  #bio { margin-top: 1rem; max-width: 30rem; font-size: 0.92rem; line-height: 1.6; color: var(--muted); }
  #hint { margin-top: 1.1rem; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; }

  #colophon {
    right: clamp(1rem, 4vw, 3rem); bottom: calc(clamp(1.25rem, 4vw, 3rem) + env(safe-area-inset-bottom, 0px));
    text-align: right; font-size: 0.75rem; line-height: 1.7; color: var(--muted);
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem;
  }
  #avatar {
    width: 44px; height: 44px; border-radius: 999px; object-fit: contain;
    border: 1px solid var(--line-strong); background: var(--panel); padding: 6px;
  }

  /* ── Splash ── */
  #splash {
    position: fixed; inset: 0; z-index: 50; background: var(--ink);
    display: grid; place-items: center; text-align: center;
    transition: opacity 0.9s var(--ease), visibility 0.9s;
  }
  #splash.done { opacity: 0; visibility: hidden; }
  #splash .wordmark { font-size: clamp(1.4rem, 3.4vw, 2.4rem); }
  #splash .kicker { margin-top: 1rem; }
  #progress { margin: 2rem auto 0; width: min(240px, 60vw); height: 1px; background: var(--line); overflow: hidden; }
  #progress i { display: block; height: 100%; width: 0; background: var(--signal); transition: width 0.4s var(--ease); }
  #count { margin-top: 0.8rem; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }

  /* ── Intro film ── */
  #film {
    position: fixed; inset: 0; z-index: 40; background: var(--ink);
    transition: opacity 1.2s var(--ease), visibility 1.2s;
  }
  #film.done { opacity: 0; visibility: hidden; }
  #film video { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.2) saturate(1.2); }
  #skip { position: absolute; right: clamp(1rem, 4vw, 3rem); bottom: calc(clamp(1.25rem, 4vw, 3rem) + env(safe-area-inset-bottom, 0px)); }

  /* ── Grid, lightbox, menu panels ── */
  .panel {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(5, 5, 5, 0.94); backdrop-filter: blur(14px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s var(--ease), visibility 0.5s;
  }
  .panel.open { opacity: 1; visibility: visible; }
  .panel-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: calc(1.25rem + env(safe-area-inset-top, 0px)) clamp(1rem, 4vw, 3rem) 1rem;
  }

  #grid { overflow-y: auto; }
  #grid-list {
    columns: 4 220px; column-gap: 1.25rem;
    padding: 1rem clamp(1rem, 4vw, 3rem) 4rem;
  }
  .tile { display: block; width: 100%; break-inside: avoid; margin-bottom: 1.5rem; text-align: left; }
  .tile-img {
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--panel);
    transition: border-color 0.3s;
  }
  .tile-img img { display: block; width: 100%; height: auto; transition: transform 0.9s var(--ease); }
  .tile:hover .tile-img { border-color: var(--signal); }
  .tile:hover .tile-img img { transform: scale(1.03); }
  .tile h3 { margin-top: 0.7rem; font-family: var(--serif); font-weight: 400; font-size: 1.2rem; }
  .tile p { margin-top: 0.15rem; font-size: 0.75rem; color: var(--muted); }

  #lightbox { display: grid; grid-template-rows: auto 1fr; }
  #lb-body {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, 22rem); gap: clamp(1.5rem, 4vw, 3.5rem);
    align-items: center; padding: 0 clamp(1rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem); min-height: 0;
  }
  #lb-figure { min-height: 0; height: 100%; display: grid; place-items: center; }
  #lb-img {
    max-width: 100%; max-height: calc(100vh - 9rem); object-fit: contain;
    border: 1px solid var(--line-strong); border-radius: 3px; background: var(--panel);
  }
  #lb-meta .kicker { margin-bottom: 1rem; }
  #lb-title { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 3.6vw, 3rem); line-height: 1.05; }
  #lb-note { margin-top: 1rem; font-size: 0.92rem; line-height: 1.65; color: var(--muted); }
  #lb-nav { margin-top: 2rem; display: flex; align-items: center; gap: 0.5rem; }
  #lb-count { margin-left: 0.75rem; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }

  #menu { display: grid; grid-template-rows: auto 1fr auto; }
  #menu-list { list-style: none; align-self: center; padding: 0 clamp(1rem, 4vw, 3rem); }
  #menu-list li { border-top: 1px solid var(--line); }
  #menu-list li:last-child { border-bottom: 1px solid var(--line); }
  #menu-list button, #menu-list a {
    display: flex; width: 100%; align-items: baseline; justify-content: space-between;
    padding: clamp(0.7rem, 2vh, 1.1rem) 0; text-align: left;
    font-family: var(--serif); font-size: clamp(2rem, 5.5vw, 3.8rem); line-height: 1.05;
    transition: color 0.3s, padding-left 0.5s var(--ease);
  }
  #menu-list button:hover, #menu-list a:hover { color: var(--signal); padding-left: 0.6rem; }
  #menu-list small { font-family: var(--sans); font-size: 0.75rem; color: var(--muted); }
  #menu-foot {
    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    padding: 1.5rem clamp(1rem, 4vw, 3rem) calc(1.5rem + env(safe-area-inset-bottom, 0px));
    font-size: 0.75rem; color: var(--muted); line-height: 1.7;
  }

  #fail {
    position: fixed; inset: 0; background: #000; display: grid; place-items: center;
    color: var(--muted); font-size: 0.875rem; text-align: center; padding: 1.5rem;
  }
  #fail a { color: var(--paper); border-bottom: 1px solid var(--line-strong); }

  @media (max-width: 760px) {
    #colophon { display: none; }
    #bio { display: none; }
    #lb-body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; align-items: start; overflow-y: auto; }
    #lb-img { max-height: 58vh; }
    #top-actions .pill span.long { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>

<div id="splash" aria-live="polite">
  <div>
    <div class="wordmark" id="splash-mark"></div>
    <div class="kicker" id="splash-tag"></div>
    <div id="progress"><i></i></div>
    <div id="count">00 / 00</div>
  </div>
</div>

<div id="film" hidden>
  <button class="pill" id="skip" type="button">Skip intro</button>
</div>

<main id="stage" aria-label="Portfolio archive. Drag to rotate, select a frame to open it.">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="viewport"><div id="sphere"></div></div>
</main>

<header class="chrome" id="top">
  <a href="/" id="home" aria-label="Linc Productions home">
    <img id="home-logo" alt="">
    <span class="wordmark" id="top-mark"></span>
  </a>
  <div id="top-actions">
    <button class="pill" id="open-grid" type="button">Index <span class="long">view</span></button>
    <button class="pill" id="open-menu" type="button" aria-haspopup="dialog">Menu</button>
  </div>
</header>

<section class="chrome" id="intro">
  <span class="kicker" id="tag"></span>
  <h1 id="headline"></h1>
  <p id="bio"></p>
  <p id="hint">Drag to explore · Select a frame to open it</p>
</section>

<footer class="chrome" id="colophon">
  <img id="avatar" alt="">
  <div id="address"></div>
  <div id="colophon-text"></div>
</footer>

<div class="panel" id="grid" role="dialog" aria-modal="true" aria-label="Index of work">
  <div class="panel-bar">
    <span class="kicker" id="grid-title">Index</span>
    <button class="pill" type="button" data-close>Close</button>
  </div>
  <div id="grid-list"></div>
</div>

<div class="panel" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <div class="panel-bar">
    <span class="wordmark" id="lb-mark"></span>
    <button class="pill" type="button" data-close>Close</button>
  </div>
  <div id="lb-body">
    <div id="lb-figure"><img id="lb-img" alt=""></div>
    <div id="lb-meta">
      <span class="kicker" id="lb-place"></span>
      <h2 id="lb-title"></h2>
      <p id="lb-note"></p>
      <div id="lb-nav">
        <button class="pill" type="button" id="lb-prev" aria-label="Previous">←</button>
        <button class="pill" type="button" id="lb-next" aria-label="Next">→</button>
        <span id="lb-count"></span>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="menu" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="panel-bar">
    <span class="wordmark" id="menu-mark"></span>
    <button class="pill" type="button" data-close>Close</button>
  </div>
  <ul id="menu-list"></ul>
  <div id="menu-foot"><div id="menu-address"></div><div id="menu-colophon"></div></div>
</div>

<script>
(function () {
  "use strict";

  var MANIFEST_URL = "/archive/manifest.json";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };

  fetch(MANIFEST_URL, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(start)
    .catch(function (err) {
      console.error("Archive manifest failed to load:", err);
      document.body.innerHTML =
        '<div id="fail"><p>The archive could not be loaded. <a href="/portfolio">Try again</a> or <a href="/">return home</a>.</p></div>';
    });

  function wordmarkInto(el, parts) {
    el.textContent = "";
    el.appendChild(document.createTextNode((parts[0] || "") + " "));
    var em = document.createElement("em");
    em.textContent = parts.slice(1).join(" ");
    el.appendChild(em);
  }

  function start(data) {
    var site = data.site || {};
    var shots = (data.shots || []).filter(function (s) { return s && s.src; }).map(function (s) {
      return {
        src: s.src,
        thumb: s.thumb || s.src,
        title: s.title || "",
        place: s.place || "",
        note: s.note || "",
        tall: typeof s.tall === "boolean" ? s.tall : null,
        w: 0, h: 0
      };
    });
    var parts = site.nameParts && site.nameParts.length ? site.nameParts : ["Linc", "Productions"];

    // ── Text content from the manifest ──
    if (site.title) document.title = site.title;
    if (site.description) document.querySelector('meta[name="description"]').setAttribute("content", site.description);
    ["splash-mark", "top-mark", "lb-mark", "menu-mark"].forEach(function (id) { wordmarkInto($(id), parts); });
    $("splash-tag").textContent = site.splashTag || "";
    $("tag").textContent = site.splashTag || "";
    $("bio").textContent = site.bio || "";
    $("colophon-text").textContent = site.colophon || "";
    $("menu-colophon").textContent = site.colophon || "";
    (site.address || []).forEach(function (line) {
      [$("address"), $("menu-address")].forEach(function (box) {
        var d = document.createElement("div"); d.textContent = line; box.appendChild(d);
      });
    });
    if (data.avatar) { $("avatar").src = data.avatar; $("home-logo").src = data.avatar; }
    else { $("avatar").hidden = true; $("home-logo").hidden = true; }

    var headline = $("headline");
    (site.headline || "").split(/\s+/).filter(Boolean).forEach(function (word, i, all) {
      var span = document.createElement("span");
      span.style.setProperty("--i", i);
      span.textContent = word;
      headline.appendChild(span);
      if (i < all.length - 1) headline.appendChild(document.createTextNode(" "));
    });

    buildMenu(site.menu || []);

    // ── Splash: preload thumbnails, learn each image's shape ──
    var total = shots.length, loaded = 0;
    var pad = function (n) { return String(n).padStart(2, "0"); };
    var setProgress = function () {
      $("count").textContent = pad(loaded) + " / " + pad(total);
      $("progress").firstElementChild.style.width = (total ? (loaded / total) * 100 : 100) + "%";
    };
    setProgress();

    var preloads = shots.map(function (shot) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.decoding = "async";
        img.onload = function () { shot.w = img.naturalWidth; shot.h = img.naturalHeight; done(); };
        img.onerror = done;
        function done() { loaded++; setProgress(); resolve(); }
        img.src = shot.thumb;
      });
    });
    var minSplash = new Promise(function (r) { setTimeout(r, reduceMotion ? 200 : 1200); });

    Promise.all([Promise.all(preloads), minSplash]).then(function () {
      shots.forEach(function (s) { if (s.tall === null) s.tall = s.h > s.w; });
      buildSphere(shots);
      buildGrid(shots);
      $("splash").classList.add("done");
      playIntro(data.intro, reveal);
    });
  }

  // ── Intro film (falls back to revealing the archive directly) ──
  function playIntro(intro, next) {
    if (!intro || !intro.video || reduceMotion) { next(); return; }
    var film = $("film"), finished = false;
    var video = document.createElement("video");
    video.muted = true; video.playsInline = true; video.autoplay = true; video.preload = "auto";
    video.setAttribute("playsinline", "");
    video.src = intro.video;
    film.insertBefore(video, film.firstChild);
    film.hidden = false;

    function finish() {
      if (finished) return; finished = true;
      film.classList.add("done");
      next();
      setTimeout(function () { video.pause(); film.remove(); }, 1300);
    }
    video.addEventListener("loadedmetadata", function () {
      video.playbackRate = intro.playbackRate || 1;
    });
    video.addEventListener("ended", finish);
    video.addEventListener("error", finish);
    $("skip").addEventListener("click", finish);
    // Never hold the archive hostage: cap the intro at 6 seconds.
    setTimeout(finish, 6000);
    var p = video.play();
    if (p && p.catch) p.catch(finish);
  }

  function reveal() { document.body.classList.add("ready"); }

  // ── Fibonacci sphere of cards ──
  var sphereState = { rx: -8, ry: 0, vx: 0, vy: 0, cards: [], dragging: false };

  function buildSphere(shots) {
    var sphere = $("sphere");
    var n = shots.length;
    var golden = Math.PI * (3 - Math.sqrt(5));

    shots.forEach(function (shot, i) {
      var y = n === 1 ? 0 : 1 - (i / (n - 1)) * 2;
      var r = Math.sqrt(Math.max(0, 1 - y * y));
      var theta = golden * i;
      var card = document.createElement("button");
      card.type = "button";
      card.className = "card" + (shot.tall ? " tall" : "");
      card.setAttribute("aria-label", "Open " + (shot.title || "frame " + (i + 1)));
      var img = document.createElement("img");
      img.src = shot.thumb; img.alt = ""; img.draggable = false; img.decoding = "async";
      card.appendChild(img);
      card.addEventListener("click", function () { if (!sphereState.moved) openLightbox(i); });
      sphere.appendChild(card);
      sphereState.cards.push({ el: card, nx: Math.cos(theta) * r, ny: y, nz: Math.sin(theta) * r, tall: shot.tall });
    });

    layoutSphere();
    window.addEventListener("resize", layoutSphere);
    bindDrag();
    requestAnimationFrame(tick);
  }

  function layoutSphere() {
    var base = Math.min(window.innerWidth, window.innerHeight);
    var n = sphereState.cards.length;
    var R = n === 1 ? 0 : base * (window.innerWidth < 760 ? 0.42 : 0.36);
    var cardW = Math.max(96, Math.min(220, base * (n > 12 ? 0.15 : 0.2)));
    sphereState.R = R;
    sphereState.cards.forEach(function (c) {
      var w = c.tall ? cardW * 0.74 : cardW;
      var h = c.tall ? w * 1.5 : w * 0.75;
      var yaw = Math.atan2(c.nx, c.nz) * 180 / Math.PI;
      var pitch = -Math.asin(c.ny) * 180 / Math.PI;
      c.el.style.width = w + "px";
      c.el.style.height = h + "px";
      c.el.style.marginLeft = -w / 2 + "px";
      c.el.style.marginTop = -h / 2 + "px";
      c.el.style.transform =
        "translate3d(" + c.nx * R + "px," + c.ny * R + "px," + c.nz * R + "px) rotateY(" + yaw + "deg) rotateX(" + pitch + "deg)";
    });
  }

  function tick() {
    var s = sphereState;
    if (!s.dragging) {
      s.ry += s.vy; s.rx += s.vx;
      s.vy *= 0.95; s.vx *= 0.95;
      if (!reduceMotion && Math.abs(s.vy) < 0.04) s.ry += 0.06;
    }
    s.rx = Math.max(-60, Math.min(60, s.rx));
    $("sphere").style.transform = "rotateX(" + s.rx + "deg) rotateY(" + s.ry + "deg)";

    // Fade cards on the far side of the sphere so depth reads clearly.
    var ax = s.rx * Math.PI / 180, ay = s.ry * Math.PI / 180;
    var cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
    s.cards.forEach(function (c) {
      var z1 = -c.nx * sy + c.nz * cy;
      var z = c.ny * sx + z1 * cx;
      var depth = (z + 1) / 2;
      c.el.style.opacity = (0.18 + 0.82 * depth).toFixed(3);
      c.el.style.pointerEvents = z > -0.2 ? "auto" : "none";
      c.el.tabIndex = z > 0 ? 0 : -1;
    });
    requestAnimationFrame(tick);
  }

  function bindDrag() {
    var stage = $("stage"), s = sphereState, lastX = 0, lastY = 0, startX = 0, startY = 0, id = null;
    stage.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      id = e.pointerId; s.dragging = true; s.moved = false;
      startX = lastX = e.clientX; startY = lastY = e.clientY;
      s.vx = s.vy = 0;
    });
    window.addEventListener("pointermove", function (e) {
      if (!s.dragging || e.pointerId !== id) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if (!s.moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 6) {
        s.moved = true; stage.classList.add("dragging");
        try { stage.setPointerCapture(id); } catch (err) {}
      }
      if (!s.moved) return;
      s.ry += dx * 0.25; s.rx -= dy * 0.25;
      s.vy = dx * 0.25; s.vx = -dy * 0.25;
    });
    var end = function (e) {
      if (e.pointerId !== id) return;
      s.dragging = false; id = null; stage.classList.remove("dragging");
      // Keep `moved` true through the click event that follows a drag.
      setTimeout(function () { s.moved = false; }, 0);
    };
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
  }

  // ── Flat grid (Index) ──
  var allShots = [];
  function buildGrid(shots) {
    allShots = shots;
    var list = $("grid-list");
    $("grid-title").textContent = "Index · " + shots.length + (shots.length === 1 ? " frame" : " frames");
    shots.forEach(function (shot, i) {
      var tile = document.createElement("button");
      tile.type = "button"; tile.className = "tile";
      var box = document.createElement("div"); box.className = "tile-img";
      var img = document.createElement("img"); img.src = shot.thumb; img.alt = ""; img.loading = "lazy";
      box.appendChild(img);
      var h = document.createElement("h3"); h.textContent = shot.title;
      var p = document.createElement("p"); p.textContent = shot.place;
      tile.appendChild(box); tile.appendChild(h); tile.appendChild(p);
      tile.addEventListener("click", function () { openLightbox(i); });
      list.appendChild(tile);
    });
  }

  // ── Panels ──
  var openPanel = null, lastFocus = null;
  function showPanel(id) {
    if (openPanel) openPanel.classList.remove("open");
    lastFocus = lastFocus || document.activeElement;
    openPanel = $(id);
    openPanel.classList.add("open");
    var btn = openPanel.querySelector("[data-close]");
    if (btn) btn.focus();
  }
  function closePanel() {
    if (!openPanel) return;
    openPanel.classList.remove("open");
    openPanel = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }
  document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closePanel); });
  $("open-grid").addEventListener("click", function () { showPanel("grid"); });
  $("open-menu").addEventListener("click", function () { showPanel("menu"); });

  // ── Lightbox ──
  var current = 0;
  function openLightbox(i) {
    if (!allShots.length) return;
    current = (i + allShots.length) % allShots.length;
    var shot = allShots[current];
    var img = $("lb-img");
    img.src = shot.src; img.alt = shot.title;
    $("lb-place").textContent = shot.place;
    $("lb-title").textContent = shot.title;
    $("lb-note").textContent = shot.note;
    $("lb-count").textContent = String(current + 1).padStart(2, "0") + " / " + String(allShots.length).padStart(2, "0");
    var single = allShots.length < 2;
    $("lb-prev").hidden = single; $("lb-next").hidden = single;
    if (!openPanel || openPanel.id !== "lightbox") showPanel("lightbox");
  }
  $("lb-prev").addEventListener("click", function () { openLightbox(current - 1); });
  $("lb-next").addEventListener("click", function () { openLightbox(current + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePanel();
    if (openPanel && openPanel.id === "lightbox" && allShots.length > 1) {
      if (e.key === "ArrowLeft") openLightbox(current - 1);
      if (e.key === "ArrowRight") openLightbox(current + 1);
    }
  });

  // ── Menu ──
  function buildMenu(items) {
    var list = $("menu-list");
    items.forEach(function (item) {
      var li = document.createElement("li"), el;
      if (item.action === "link" && item.href) {
        el = document.createElement("a"); el.href = item.href;
      } else {
        el = document.createElement("button"); el.type = "button";
        el.addEventListener("click", function () {
          if (item.action === "grid") showPanel("grid"); else closePanel();
        });
      }
      el.appendChild(document.createTextNode(item.label || ""));
      if (item.action === "grid") {
        var hint = document.createElement("small"); hint.textContent = "Index";
        el.appendChild(hint);
      }
      li.appendChild(el); list.appendChild(li);
    });
  }

  // ── Star field, echoing the homepage hero ──
  (function stars() {
    var canvas = $("stars"), ctx = canvas.getContext("2d"), pts = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
    function size() {
      canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
      pts = [];
      var count = Math.round((innerWidth * innerHeight) / 5200);
      for (var i = 0; i < count; i++) {
        pts.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.1 * dpr + 0.2, p: Math.random() * Math.PI * 2 });
      }
    }
    function draw(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < pts.length; i++) {
        var s = pts[i];
        var a = reduceMotion ? 0.55 : 0.35 + 0.35 * Math.sin(t / 1400 + s.p);
        ctx.fillStyle = "rgba(245,242,234," + a.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      if (!reduceMotion) requestAnimationFrame(draw);
    }
    size();
    window.addEventListener("resize", function () { size(); if (reduceMotion) requestAnimationFrame(draw); });
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
